{% extends 'app/base.html' %}
    {% block content %}
    <h1>Articles List</h1>
    <a href="{% url 'create_article' %}">Create a new article</a>
    <ul>
        {% for article in articles %}
            <li>Update article <a href="{% url 'update_article' article.id %}">{{article.title}}</a> with word numbers: {{article.word_counts}}</li>
        {% endfor %}
    </ul>
    {% endblock content %}
